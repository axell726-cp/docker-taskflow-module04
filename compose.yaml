name: docker-taskflow-module04

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-taskflow-module04:local
    container_name: taskflow-module04
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3004}:3000"
    volumes:
      - taskflow-data:/data
    networks:
      - taskflow
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  taskflow:
    driver: bridge

volumes:
  taskflow-data:
